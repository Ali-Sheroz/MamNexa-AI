name: CI

# Lightweight CI: installs the DEMO dependency tier (no TensorFlow) and runs the
# TensorFlow-free test suite -- the guardrail sweeps, molecular cohort validation
# and provenance, the PDF report honesty block, the backend + Right-to-Erasure
# flow, DICOM preprocessing, patient-level split leakage gate, and OpenCV
# localization. It deliberately does NOT download datasets, install TensorFlow,
# or run any model training -- those are exercised locally. Keeping CI light
# means no large downloads and no credentials are ever needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: TF-free tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install demo-tier dependencies (no TensorFlow)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-demo.txt

      - name: Run the TensorFlow-free test suite
        run: |
          python -m pytest -q \
            tests/test_backend.py \
            tests/test_data_split.py \
            tests/test_honesty_regressions.py \
            tests/test_localization.py \
            tests/test_molecular.py \
            tests/test_preprocessing.py \
            tests/test_report.py
